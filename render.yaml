services:
  - type: web
    name: crewdesk
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
